name: Auto Compile MRS

on:
  workflow_dispatch:
  push:
    paths:
      - '*.list'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 拉取完整历史，才能和推送前的版本做对比

      - name: Fetch Latest Mihomo Version and Install
        run: |
          mkdir -p bin
          echo "🔍 正在向 GitHub API 查询 Mihomo 最新版本标签..."

          # 动态获取最新 Release 的 tag 名字 (例如 v1.19.27)
          LATEST_TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')

          # 如果 API 请求失败或被限流，设定一个保底版本
          if [ -z "$LATEST_TAG" ]; then
            echo "⚠️ 动态获取版本失败，可能触发 API 限流，启用保底版本 v1.19.26"
            LATEST_TAG="v1.19.26"
          fi
          echo "🚀 检测到最新版本为: $LATEST_TAG"

          # 去除版本号开头的 'v' 字母，有些二进制包名不带 v
          VERSION_NUM=$(echo "$LATEST_TAG" | sed 's/^v//')

          echo "📥 开始下载最新版二进制文件..."
          # 使用动态变量拼接下载链接
          curl -sSLf "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz" -o bin/mihomo.gz || \
          curl -sSLf "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-v${VERSION_NUM}.gz" -o bin/mihomo.gz

          # 解压并赋予权限
          gzip -d bin/mihomo.gz
          chmod +x bin/mihomo
          sudo mv bin/mihomo /usr/local/bin/mihomo
          echo "✅ Mihomo 内核部署成功，当前运行版本："
          mihomo -v

      - name: Compile Changed Lists
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # 手动运行，或找不到推送前的提交（新分支、强制推送）时，全部重新编译
          full=false
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "ℹ️ 手动运行或无法对比推送前版本，将编译全部规则"
            full=true
          fi

          # 根目录下每个 .list 都编译成同名 .mrs；文件名以 -ip.list 结尾的按 IP 段规则处理
          for list in *.list; do
            [ -f "$list" ] || continue
            if [ "$full" = false ] && git diff --quiet "$BEFORE_SHA" HEAD -- "$list"; then
              echo "⏭️ ${list} 未变动，跳过编译"
              continue
            fi

            case "$list" in
              *-ip.list) behavior=ipcidr ;;
              *)         behavior=domain ;;
            esac
            mrs="${list%.list}.mrs"

            echo "🧹 正在清洗 ${list} 的无效字符..."
            sed 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' "$list" > "$RUNNER_TEMP/clean.txt"

            echo "⚙️ 正在编译 ${list} → ${mrs}（${behavior}）..."
            mihomo convert-ruleset "$behavior" text "$RUNNER_TEMP/clean.txt" "$mrs"
          done

      - name: Commit and Push Results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # 暂存所有 .mrs，未重新编译或内容没变的文件不会产生改动
          for mrs in *.mrs; do
            if [ -f "$mrs" ]; then
              git add -- "$mrs"
            fi
          done

          # 检查暂存区是否有实际改动
          if ! git diff --staged --quiet; then
            echo "📝 发现文件变动，正在提交..."
            git commit -m "Automated update: Compiled MRS rules [skip ci]"
            git push origin HEAD
          else
            echo "✅ 规则内容无实际变化，跳过本次推送。"
          fi
